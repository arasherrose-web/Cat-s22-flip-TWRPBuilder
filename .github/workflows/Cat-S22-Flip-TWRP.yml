name: Build experimental TWRP for CAT S22 Flip (Android 11)
on:
  workflow_dispatch:
    inputs:
      bcb_fallback:
        description: 'Experimental: retry boot-message clearing on misc partition mmcblk0p27'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out builder
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Free runner space and install build tools
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift
          df -h /
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop python-is-python3 rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Initialize and sync TWRP 11 source
        run: |
          set -euxo pipefail
          git config --global user.name "TWRP Builder"
          git config --global user.email "twrp-builder@localhost"
          mkdir -p android-recovery
          cd android-recovery
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
          repo sync -c --no-clone-bundle --no-tags -j2
      - name: Add CAT S22 device tree and package its DTB
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch 'S22FLIP-user-11-RKQ1.210416.002-LTE_S02113.11_N_S22Flip_0.030.03-release-keys' https://github.com/twrpdtgen/android_device_cat_S22FLIP.git device-tree
          mv device-tree/omni_S22FLIP.mk device-tree/twrp_S22FLIP.mk
          sed -i 's/omni_S22FLIP/twrp_S22FLIP/g; s#vendor/omni/config/common.mk#vendor/twrp/config/common.mk#' device-tree/AndroidProducts.mk device-tree/twrp_S22FLIP.mk
          rm -f device-tree/vendorsetup.sh
          python3 - <<'PY'
          from pathlib import Path
          board = Path('device-tree/BoardConfig.mk')
          text = board.read_text()
          old = 'TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel'
          new = 'TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel-with-appended-dtb'
          if text.count(old) != 1:
              raise SystemExit('Expected kernel setting was not found exactly once')
          text = text.replace(old, new)
          text = '\n'.join(line for line in text.splitlines() if 'BOARD_MKBOOTIMG_ARGS += --dtb $(TARGET_PREBUILT_DTB)' not in line) + '\n'
          board.write_text(text)
          prebuilt = Path('device-tree/prebuilt')
          (prebuilt / 'kernel-with-appended-dtb').write_bytes((prebuilt / 'kernel').read_bytes() + (prebuilt / 'dtb.img').read_bytes())
          PY
          mkdir -p android-recovery/device/cat/S22FLIP
          cp -a device-tree/. android-recovery/device/cat/S22FLIP/
      - name: Apply optional experimental BCB fallback
        if: ${{ inputs.bcb_fallback }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android-recovery/bootable/recovery/twrp-functions.cpp')
          text = path.read_text()
          pattern = re.compile(r'void TWFunc::Clear_Bootloader_Message\(\)\s*\{.*?\n\}', re.S)
          replacement = r'''void TWFunc::Clear_Bootloader_Message() {
              std::string err;
              if (!clear_bootloader_message(&err)) {
                  LOGINFO("%s%c", err.c_str(), 10);
                  bootloader_message boot{};
                  const std::string misc = "/dev/block/mmcblk0p27";
                  err.clear();
                  if (!write_bootloader_message_to(boot, misc, &err)) {
                      LOGINFO("Failed to clear BCB on %s: %s%c", misc.c_str(), err.c_str(), 10);
                  } else {
                      LOGINFO("Cleared BCB using %s%c", misc.c_str(), 10);
                  }
              }
          }'''
          updated, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not find Clear_Bootloader_Message() to patch')
          path.write_text(updated)
          PY
      - name: Build recovery image
        run: |
          set -euxo pipefail
          cd android-recovery
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_S22FLIP-eng
          mka -j2 recoveryimage
      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: cat-s22-flip-twrp-android-11
          path: android-recovery/out/target/product/S22FLIP/recovery.img
          if-no-files-found: error
          retention-days: 7
