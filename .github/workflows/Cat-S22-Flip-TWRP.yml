name: Cat S22 Flip TWRP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/catthehacker/ubuntu:runner-18.04

    env:
      LC_ALL: C.UTF-8
      DEVICE_PATH: device/cat/S22FLIP
      DEVICE_NAME: S22FLIP
      BUILD_TARGET: twrp_S22FLIP-eng
      OUTPUT_DIR: android-recovery/out/target/product/S22FLIP

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev python2
          ln -sf /usr/bin/python3 /usr/bin/python || true

      - name: Install Java 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Android source
        run: |
          mkdir -p android-recovery
          cd android-recovery
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          repo init --depth=1 -u https://github.com/mlm-games/platform_manifest_twrp_omni -b twrp-10.0-deprecated

      - name: Sync source
        working-directory: android-recovery
        run: |
       repo sync --force-sync --no-clone-bundle --no-tags -j4

      - name: Clone Cat S22 Flip device tree
        working-directory: android-recovery
        run: |
          mkdir -p "${DEVICE_PATH}"
          git clone --depth=1 -b main https://github.com/CatS22Flip-Devs/android_device_cat_S22FLIP-twrp "${DEVICE_PATH}"

      - name: Build recovery
        working-directory: android-recovery
        shell: bash
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "${BUILD_TARGET}"
          make clean
         make recoveryimage -j4
      - name: Upload recovery image
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: s22flip-${{ github.run_number }}
          name: Cat S22 Flip TWRP ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.OUTPUT_DIR }}/recovery.img
            ${{ env.OUTPUT_DIR }}/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
