        cd android-recovery
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ inputs.MANIFEST_BRANCH }}
        repo sync
        cd ${GITHUB_WORKSPACE]
        git clone --depth 1 -b=${{ inputs.DEVICE_TQT_BRANCH }} ${{ inputs.DEVICE_TQT_I_@} temp_dtb
