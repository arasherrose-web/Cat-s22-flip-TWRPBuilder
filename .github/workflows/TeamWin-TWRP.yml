name: TeamWin [TWRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: ''
        type: choice
        options:
        - twrp-14
        - twrp-12.1
        - twrp-11
        - twrp-10.0-deprecated
        - twrp-9.0
        - twrp-8.1
        - twrp-8.1-macOS
        - twrp-7.1
        - twrp-6.0
        - twrp-5.1
        - twrp-4.4-deprecated
      DEVICE_TQER:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/username/repto'
      DEVICE_TREE_BRANCH: 
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'enter_your_branch'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: ''
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (without including .te, Example: omni_7304F')
        required: true
        default: 'omni_'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'Äú
        required: false
        default: 'false'
        type: boolean
      LDCKECHPATH:
        description: 'Path of blocs to check'
        required: true
        defaullt: 'system/bin/qseecomd'

jors:
